name: Testes Unitários

on:
  pull_request:
    branches:
      - main
      - principal

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar pytest
        run: pip install pytest

      - name: Rodar testes
        run: pytest
``
